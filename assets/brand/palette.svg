<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="Paleta do Ace" font-family="Geist, Inter, system-ui, sans-serif">
  <rect width="640" height="160" fill="#FFFFFF"/>
  <g>
    <rect x="16" y="16" width="192" height="96" rx="12" fill="#648DE5"/>
    <text x="28" y="90" font-size="13" font-weight="600" fill="#F1F1F1">Ace Blue</text>
    <text x="28" y="104" font-size="11" fill="#F1F1F1" opacity="0.85">#648DE5</text>
    <text x="16" y="136" font-size="11" fill="#171717">Primária — embeds e destaques</text>
  </g>
  <g>
    <rect x="224" y="16" width="192" height="96" rx="12" fill="#171717"/>
    <text x="236" y="90" font-size="13" font-weight="600" fill="#F1F1F1">Ink</text>
    <text x="236" y="104" font-size="11" fill="#F1F1F1" opacity="0.85">#171717</text>
    <text x="224" y="136" font-size="11" fill="#171717">Fundo — superfícies escuras</text>
  </g>
  <g>
    <rect x="432" y="16" width="192" height="96" rx="12" fill="#F1F1F1" stroke="#171717" stroke-opacity="0.12"/>
    <text x="444" y="90" font-size="13" font-weight="600" fill="#171717">Eye White</text>
    <text x="444" y="104" font-size="11" fill="#171717" opacity="0.7">#F1F1F1</text>
    <text x="432" y="136" font-size="11" fill="#171717">Texto e olhos do símbolo</text>
  </g>
</svg>
