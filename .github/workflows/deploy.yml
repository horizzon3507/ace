name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart bot server
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" -X POST \
            "${{ secrets.PANEL_URL }}/api/core/control/servers/${{ secrets.SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${{ github.run_id }}-${{ github.run_attempt }}" \
            -d "{\"tenantId\":\"${{ secrets.TENANT_ID }}\",\"signal\":\"restart\"}")
          echo "HTTP $code"; cat resp.json; echo
          test "$code" -lt 400
